services:
  munter-web:
    build: .
    image: consultora-munter-asociados:latest
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_FROM: ${NOTIFICATION_FROM:-}
      NOTIFICATION_TO: ${NOTIFICATION_TO:-consultoramunteryasociados@gmail.com}
    volumes:
      - munter-consultas:/app/data
    restart: unless-stopped

volumes:
  munter-consultas:
